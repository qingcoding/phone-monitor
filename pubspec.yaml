name: phone_monitor
description: "旧手机监控 - 闲置手机改造家用监控工具（婴儿看护/宠物看护/居家安防）"
publish_to: 'none'
version: 1.2.1+4

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # WebRTC 实时音视频（P2P）
  flutter_webrtc: ^0.11.7

  # 权限
  permission_handler: ^11.3.1

  # 二维码
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # 状态与持久化
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # 保活/防息屏
  wakelock_plus: ^1.2.5
  flutter_background_service: ^5.1.0

  # 网络信息（获取本机局域网 IP）
  network_info_plus: ^5.0.3

  # WebSocket 信令客户端
  web_socket_channel: ^3.0.0

  # 路径工具
  path: ^1.9.0

  # 本地录像
  camera: ^0.10.6

  # 工具
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/index.html
